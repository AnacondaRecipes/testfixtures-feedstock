{% set name = "testfixtures" %}
{% set version = "12.4.0" %}
{% set skip_tests = [
  "--ignore=tests/test_django",
  "--deselect=tests/test_shouldwarn.py::ShouldWarnTests::test_filter_missing",
  "--deselect=tests/test_shouldwarn.py::ShouldWarnTests::test_filter_present"
] %}
{% set skip_tests = 'skip_tests + ["--deselect=tests/test_sybil.py::TestFileParser::test_evaluate_read_difference"]' %}  # [win]
{% set skip_tests = 'skip_tests + ["--deselect=tests/test_tempdirectory.py::TestClone::test_clone_nonexistent_source_raises"]' %}  # [win]

# django package in not available now, skip tests for it
#
# AssertionError: Expected AssertionError('\n<SequenceComparison(ordered=True, partial=False)(failed)>\nsame:\n[]\n\nexpected:
# \n[<C:builtins.DeprecationWarning>]\n\nactual:\n[]\n</SequenceComparison(ordered=True, partial=False)> (expected) != [] (actual)'), None raised!
# AssertionError:
# -+++ Reading from "C:\Users\TA9AC1~1\AppData\Local\Temp\tmpblvwk_5c/foo":
# ++++ Reading from "C:\Users\TA9AC1~1\AppData\Local\Temp\tmpblvwk_5c\foo":
# FileNotFoundError(2, 'No such file or directory') -> pytest-0/test_clone_nonexistent_source_1
package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: cc0108614f88ace8817b587bea06615bdd225fec392ed3de8afabff5d1ef21c7

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<311]

requirements:
  host:
    - python
    - pip
    - hatchling
  run:
    - python
    - typing_extensions >=4.12  # [py<313]
  run_constrained:
    # django
    - django >=4  # [py<313]
    - django >=5.1.3  # [py>=313]
    # sybil
    - sybil >=10.1.0
    # mock-backport
    - mock >=4.0.3
    # twisted
    - twisted >=22.1
    # yaml
    - pyyaml >=6.0.3
    # toml
    - tomlkit >=0.10.0
    - loguru >=0.7.3
    - numpy >=2.3.2
    - pandas >=2.3.3
    - polars >=1.32
    - structlog >=24.3.0

test:
  source_files:
    - tests
  imports:
    - testfixtures
  requires:
    - pip
    - sybil >=6.0.3
    - twisted >=22.1
    - pytest >=8.0
  commands:
    - pip check
    - pytest -v tests {{ skip_tests | join(' ')}}

about:
  home: https://testfixtures.readthedocs.io
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: A collection of helpers and mock objects for unit tests and doc tests.
  description: |
    Testfixtures is a collection of helpers and mock objects that are useful when writing automated tests in Python.
  doc_url: https://testfixtures.readthedocs.io
  dev_url: https://github.com/Simplistix/testfixtures

extra:
  recipe-maintainers:
    - ChrisBarker-NOAA
    - JamesMakela-NOAA
    - cjw296
